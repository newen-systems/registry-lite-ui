# Builds the image with rootless buildah in an unprivileged job: no docker daemon, no dind, no privileged runner.
stages: [test, build]

variables:
  # quay.io/buildah/stable:v1.43.2. A site with an internal mirror sets BUILDAH_IMAGE, and BASE_IMAGE for the Containerfile base, as project CI variables. REGISTRY_CA_BUNDLE (type File) trusts a registry certificate from an internal CA.
  BUILDAH_IMAGE: quay.io/buildah/stable@sha256:704af5d17babbd88bd93c06ecea7554001a2e9570e1fd54687188d3ae5de0e55

unit-test:
  stage: test
  # python:3.12-slim
  image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
  script:
    - python3 -m unittest discover -s tests -p 'unit_test.py' -v

build:
  stage: build
  image: $BUILDAH_IMAGE
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: docker  # keeps HEALTHCHECK, which the OCI format drops
  script:
    # a pipeline for tag vX.Y.Z that does not match VERSION fails here, before the build
    - release=$(.github/scripts/release.sh decide "refs/tags/${CI_COMMIT_TAG:-}" "$(cat VERSION)")
    # BUILD_PLATFORM (for example linux/amd64) sets the image platform. Unset, the image is built for the runner's own architecture.
    - buildah build ${BUILD_PLATFORM:+--platform "$BUILD_PLATFORM"} ${BASE_IMAGE:+--build-arg "BASE_IMAGE=$BASE_IMAGE"} --build-arg "APP_VERSION=$(cat VERSION)" --build-arg "APP_REVISION=$CI_COMMIT_SHA" -f Containerfile -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - |
      # same tags as ghcr.io: main moves edge, a release tag vX.Y.Z publishes X.Y.Z (what Renovate pins), X.Y, X and latest
      version=$(cat VERSION)
      tags=""
      [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && tags="edge"
      [ "$release" = release=true ] && tags="$tags $version ${version%.*} ${version%%.*} latest"
      if [ -n "$tags" ]; then
        if [ -n "${REGISTRY_CA_BUNDLE:-}" ]; then  # a File variable holding the PEM chain, for a registry with an internal CA
          mkdir -p "/etc/containers/certs.d/$CI_REGISTRY" && cp "$REGISTRY_CA_BUNDLE" "/etc/containers/certs.d/$CI_REGISTRY/ca.crt"
        fi
        printf %s "$CI_JOB_TOKEN" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        buildah push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        for t in $tags; do
          buildah tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:$t"
          buildah push "$CI_REGISTRY_IMAGE:$t"
        done
      fi
