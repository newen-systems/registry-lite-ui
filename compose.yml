# registry:2 is published directly, exactly as before. The UI is a separate service that calls it.
# Both run as uid and gid 65534, so one chown of the shared host files (README, Shared ownership) suits both.
# The image itself runs as root; `user:` drops that, and registry-init gives the data volume to 65534.
services:
  registry-init:
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    user: "0:0"
    entrypoint: ["chown", "-R", "65534:65534", "/var/lib/registry"]
    volumes: [registry-data:/var/lib/registry]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  registry:
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    user: "65534:65534"
    depends_on:
      registry-init:
        condition: service_completed_successfully
    ports: ["${REGISTRY_PORT:-5000}:5000"]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes: [registry-data:/var/lib/registry]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  registry-lite-ui:
    # `up -d` pulls this image, `up -d --build` builds Containerfile and tags it with the same name.
    image: ${UI_IMAGE:-ghcr.io/newen-systems/registry-lite-ui:latest}
    build:
      context: .
      dockerfile: Containerfile
    ports: ["${UI_BIND:-127.0.0.1}:${UI_PORT:-8080}:8080"]
    environment:
      REGISTRY_URL: http://registry:5000
      UI_ALLOWED_HOSTS: "${UI_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}"
      UI_READONLY: "${UI_READONLY:-false}"
      UI_REGISTRY_HOST: "${UI_REGISTRY_HOST:-}"
      UI_ENVIRONMENTS: "${UI_ENVIRONMENTS:-}"
      UI_REGISTRY_STORAGE: "${UI_REGISTRY_STORAGE:-}"
      UI_REGISTRY_SERVICE: "${UI_REGISTRY_SERVICE:-registry}"
      UI_POLL_INTERVAL: "${UI_POLL_INTERVAL:-30}"
      UI_POLL_BURST: "${UI_POLL_BURST:-5}"
      UI_POLL_BURST_MAX: "${UI_POLL_BURST_MAX:-600}"
      UI_POLL_MIN: "${UI_POLL_MIN:-10}"
      UI_STATE_DIR: /state
      UI_MAX_EVENTS: "${UI_MAX_EVENTS:-1000}"
    volumes: [ui-state:/state]
    mem_limit: 128m
    pids_limit: 128
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import os, ssl, urllib.request as u; u.urlopen(('https' if os.environ.get('UI_TLS_CERT') else 'http') + '://127.0.0.1:8080/healthz', timeout=2, context=ssl._create_unverified_context())"]
      interval: 30s
      timeout: 3s
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  registry-data:
  ui-state:
