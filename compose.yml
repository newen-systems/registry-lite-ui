# registry:2 is published directly, exactly as before. The UI is a separate service that calls it.
# Both run as uid and gid 65534, so one chown of the shared host files (README, Shared ownership) suits both.
# The image itself runs as root; `user:` drops that, and registry-init gives the data volume to 65534.
# The named `registry-data` volume is shared between the registry and the UI. On SELinux it already carries a
# shared label, so both read it with no suffix. To store on a host directory instead, bind-mount the same path
# into both services with `:z` (lowercase, shared), never `:Z` (uppercase, private per-container): a `:Z` mount
# relabels the storage so only one container can read it and the UI gets errno 13. See README, "Permission denied".
services:
  registry-init:
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    user: "0:0"
    entrypoint: ["chown", "-R", "65534:65534", "/var/lib/registry"]
    volumes: [registry-data:/var/lib/registry]  # host dir instead: - /data/registry:/var/lib/registry:z
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  registry:
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    user: "65534:65534"
    depends_on:
      registry-init:
        condition: service_completed_successfully
    ports: ["${REGISTRY_PORT:-5000}:5000"]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes: [registry-data:/var/lib/registry]  # host dir instead: - /data/registry:/var/lib/registry:z
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  registry-lite-ui:
    # `up -d` pulls this image, `up -d --build` builds Containerfile and tags it with the same name.
    image: ${UI_IMAGE:-ghcr.io/newen-systems/registry-lite-ui:latest}
    build:
      context: .
      dockerfile: Containerfile
    # Runs as uid 65534 by default (set PUID/PGID to change it, no `user:` line needed), which matches the registry
    # here. To read a registry storage directory owned by another uid, set PUID/PGID to it, or PUID=0 PGID=0 to read
    # a root-owned one. See README, "Permission denied".
    ports: ["${UI_BIND:-127.0.0.1}:${UI_PORT:-8080}:8080"]
    environment:
      REGISTRY_URL: http://registry:5000
      UI_ALLOWED_HOSTS: "${UI_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}"
      UI_READONLY: "${UI_READONLY:-false}"
      UI_REGISTRY_HOST: "${UI_REGISTRY_HOST:-}"
      UI_ENVIRONMENTS: "${UI_ENVIRONMENTS:-}"
      UI_REGISTRY_STORAGE: "${UI_REGISTRY_STORAGE:-}"
      UI_REGISTRY_SERVICE: "${UI_REGISTRY_SERVICE:-registry}"
      UI_REGISTRY_STORAGE_MOUNT: /registry  # the registry data, read-only: when each layer was pushed, and what a tag pointed at before
      UI_POLL_INTERVAL: "${UI_POLL_INTERVAL:-30}"
      UI_POLL_BURST: "${UI_POLL_BURST:-5}"
      UI_POLL_BURST_MAX: "${UI_POLL_BURST_MAX:-600}"
      UI_POLL_MIN: "${UI_POLL_MIN:-10}"
      UI_USAGE_INTERVAL: "${UI_USAGE_INTERVAL:-3600}"
      UI_BIN_DAYS: "${UI_BIN_DAYS:-7}"
      UI_STATE_DIR: /state/data  # a sub-path the UI creates and owns, so a root-owned fresh volume still persists history
      # PUID: "0"   # and PGID: "0" to run as root, for a registry storage dir only root can read (README, "Permission denied")
      UI_MAX_EVENTS: "${UI_MAX_EVENTS:-1000}"
    volumes: [ui-state:/state, registry-data:/registry:ro]  # host dir instead: - /data/registry:/registry:ro,z (same path the registry mounts)
    mem_limit: 128m
    pids_limit: 128
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import os, ssl, urllib.request as u; u.urlopen(('https' if os.environ.get('UI_TLS_CERT') else 'http') + '://127.0.0.1:8080/healthz', timeout=2, context=ssl._create_unverified_context())"]
      interval: 30s
      timeout: 3s
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]  # so the root-started image can create UI_STATE_DIR and drop to PUID:PGID, then it holds none
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  registry-data:
  ui-state:
