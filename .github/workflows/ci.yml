name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 -m unittest discover -s tests -p 'unit_test.py' -v
      - run: node --test tests/ui_test.mjs
      - name: Compose smoke test
        run: |
          export REGISTRY_PORT=5000 UI_PORT=8080 UI_USAGE_INTERVAL=60
          docker compose up -d --build
          for i in $(seq 30); do curl -fs localhost:5000/v2/ && curl -fs localhost:8080/healthz && break; sleep 1; done
          docker pull busybox:latest
          docker tag busybox:latest localhost:5000/ci/busybox:1
          docker push localhost:5000/ci/busybox:1
          docker rmi localhost:5000/ci/busybox:1
          docker pull localhost:5000/ci/busybox:1
          curl -fs localhost:8080/api/repos | grep -q ci/busybox
          curl -fs 'localhost:8080/api/tags?repo=ci/busybox' | grep -q '"tag": "1"'
          # Recent survives a restart of the UI container
          for i in $(seq 60); do curl -fs localhost:8080/api/recent | jq -e .baselined >/dev/null && break; sleep 1; done
          docker tag busybox:latest localhost:5000/ci/busybox:2
          docker push -q localhost:5000/ci/busybox:2
          for i in $(seq 60); do curl -fs localhost:8080/api/recent | jq -e '.events | map(.ref) | index("ci/busybox:2")' >/dev/null && break; sleep 1; done
          # Usage page: sizes, ages and the history point of the first scan
          for i in $(seq 150); do curl -fs localhost:8080/api/usage | jq -e '.total > 0' >/dev/null && break; sleep 1; done
          curl -fs localhost:8080/api/usage | jq -e '.mount and .disk >= .total and (.history | length) >= 1 and (.tree.kids | length) >= 1'
          curl -fs 'localhost:8080/api/ages?repo=ci/busybox' | jq -e '.tags["1"][1] | IN("atime", "mtime")'
          # Storage view: disk fill, per-node numbers, and what deleting a repository's tags frees
          curl -fs localhost:8080/api/disk | jq -e '.fs.total > .fs.used and .fs.used > 0'
          curl -fs localhost:8080/api/usage | jq -e '.atime != null and .fs.total > 0 and (.tree.kids[0] | .tags > 0 and .held >= .size)'
          for i in $(seq 150); do curl -fs 'localhost:8080/api/storage/repo?repo=ci/busybox' | jq -e '.tags | length == 2' >/dev/null && break; sleep 1; done  # a scan after both tags were pushed
          curl -fs 'localhost:8080/api/storage/repo?repo=ci/busybox' | jq -e '(.tags | length) == 2 and ([.tags[].frees] | max) > 0 and ([.tags[] | select(.shares != null)] | length) == 1'
          docker compose restart registry-lite-ui
          for i in $(seq 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/api/recent | jq -e '.persistent and (.events | map(.ref) | index("ci/busybox:2") != null)'
          curl -fs localhost:8080/api/config | jq -e '.pypi == null'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/pypi/packages)" = 404
          # Recent without a saved history: drop the state volume, start again, the existing tags are still listed from storage time
          docker compose stop registry-lite-ui
          docker compose rm -f registry-lite-ui
          docker volume ls -q | grep ui-state | xargs docker volume rm
          docker compose up -d registry-lite-ui
          for i in $(seq 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          for i in $(seq 90); do curl -fs localhost:8080/api/recent | jq -e .baselined >/dev/null && break; sleep 1; done
          curl -fs localhost:8080/api/recent | jq -e '.events | map(select(.src == "storage") | .ref) | index("ci/busybox:1") != null'
          # Bin: delete a tag, find it in the bin, restore it, pull it
          csrf=$(curl -fs localhost:8080/api/config | jq -r .csrf)
          dg=$(curl -fs 'localhost:8080/api/tags?repo=ci/busybox' | jq -r '.[] | select(.tag=="2") | .digest')
          post() { curl -fs -X POST "localhost:8080$1" -H 'Content-Type: application/json' -H "X-CSRF-Token: $csrf" -d "$2"; }
          post /api/delete "{\"repo\":\"ci/busybox\",\"digest\":\"$dg\"}" | jq -e '.deleted | length >= 1'
          curl -fs 'localhost:8080/api/tags?repo=ci/busybox' | jq -e 'map(.tag) | index("2") == null'
          id=$(curl -fs localhost:8080/api/bin | jq -r '.entries[] | select(.tag=="2") | .id')
          test -n "$id"
          post /api/bin/restore "{\"id\":\"$id\"}" | jq -e '.tag == "2" and .digest == "'"$dg"'"'
          docker rmi localhost:5000/ci/busybox:2 || true
          docker pull localhost:5000/ci/busybox:2
          curl -fs localhost:8080/api/bin | jq -e '[.entries[].tag] == ["1"]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/bin/empty -H 'Content-Type: application/json' -d '{}')" = 403
          docker compose down -v
      - name: PyPI source smoke test against a fake GitLab
        run: |
          (cd tests && python3 fake_gitlab.py 9000 0.0.0.0 &)
          mkdir -p secrets && python3 -c "import sys; sys.path.insert(0, 'tests'); import unit_test; print(unit_test.TOKEN)" > secrets/gitlab_token
          chmod 644 secrets/gitlab_token
          cat > compose.ci.yml <<'YML'
          services:
            registry-lite-ui:
              extra_hosts: ["host.docker.internal:host-gateway"]
          YML
          export REGISTRY_PORT=5000 UI_PORT=8080 PYPI_INDEX_URL=http://host.docker.internal:9000/api/v4/groups/grp/-/packages/pypi/simple
          docker compose -f compose.yml -f compose.pypi.yml -f compose.ci.yml up -d --build
          for i in $(seq 60); do curl -fs localhost:8080/api/config | jq -e '.pypi.scope != null' >/dev/null && break; sleep 1; done
          curl -fs localhost:8080/api/config | jq -e '.pypi.scope.path == "grp" and .pypi.indexAuth == "token"'
          curl -fs localhost:8080/api/pypi/packages | jq -e '(.packages | length) == 249'
          curl -fs 'localhost:8080/api/pypi/files?id=1' | jq -e '.[0].requires == ">=3.8"'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8080/api/pypi/files?id=424242')" = 404
          docker compose -f compose.yml -f compose.pypi.yml -f compose.ci.yml logs registry-lite-ui
          docker compose -f compose.yml -f compose.pypi.yml -f compose.ci.yml down -v
      - name: TLS test
        run: |
          command -v skopeo || sudo apt-get install -y skopeo
          tests/tls.sh
