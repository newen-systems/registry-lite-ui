name: build
on:
  push:
    branches: [main]
    tags: ["v*"]  # a release is a pushed tag vX.Y.Z that matches VERSION
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a run on main or a tag is never cancelled
env:
  IMAGE: ghcr.io/newen-systems/registry-lite-ui
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 -m unittest discover -s tests -p 'unit_test.py' -v
      - name: Check VERSION and the release decision
        run: |
          .github/scripts/release.sh check "$(cat VERSION)"
          tests/release.sh
          .github/scripts/release.sh decide "$GITHUB_REF" "$(cat VERSION)"  # a tag that does not match VERSION fails here, before any build
      - name: Simulate a checkout made under umask 077
        run: chmod -R go-rwx app
      - name: Build amd64 and arm64 with buildah
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          # docker format keeps HEALTHCHECK, which the OCI format drops
          for a in amd64 arm64; do
            buildah build --format docker --platform linux/$a --build-arg APP_VERSION="$(cat VERSION)" --build-arg APP_REVISION="$GITHUB_SHA" -t localhost/ui:$a -f Containerfile .
          done
      - name: Smoke test with podman
        run: |
          podman network create ci
          podman volume create reg-data
          podman run --rm --user 0:0 --entrypoint chown -v reg-data:/var/lib/registry \
            registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 -R 65534:65534 /var/lib/registry
          podman run -d --name registry --network ci --user 65534:65534 -v reg-data:/var/lib/registry -p 5000:5000 -e REGISTRY_STORAGE_DELETE_ENABLED=true \
            registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          podman run -d --name ui --network ci -p 8080:8080 --read-only -v ui-state:/state \
            -e REGISTRY_URL=http://registry:5000 localhost/ui:amd64
          for i in $(seq 30); do curl -fs localhost:5000/v2/ && curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/api/recent | jq -e .persistent  # history goes to /state without UI_STATE_DIR set
          podman exec ui id -u | grep -qx 65534
          podman exec registry id -u | grep -qx 65534
          skopeo copy --dest-tls-verify=false docker://docker.io/library/busybox:latest docker://localhost:5000/ci/busybox:1
          sleep 2
          curl -fs localhost:8080/api/repos | grep -q ci/busybox
          curl -fs 'localhost:8080/api/tags?repo=ci/busybox' | grep -q '"tag": "1"'
          podman logs ui
          podman healthcheck run ui
          curl -fs localhost:8080/api/config | jq -e --arg v "$(cat VERSION)" --arg r "$GITHUB_SHA" '.version == $v and .revision == $r'
      - name: Export one archive per platform
        if: github.event_name == 'push'
        run: |
          # docker archives keep the HEALTHCHECK, which an OCI archive drops
          for a in amd64 arm64; do podman save -o ui-$a.tar localhost/ui:$a; done
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image
          path: ui-*.tar
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: build
    # A release tag on the head of main starts two runs for one commit. Both push the sha tag, so one at a time, or one
    # overwrites the other's image while the other checks its tags against it.
    concurrency:
      group: publish-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # contents: write creates the GitHub Release for a tag, packages: write pushes the image
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
      - name: Decide whether this push is a release
        id: decide
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          .github/scripts/release.sh decide "$GITHUB_REF" "$version" | tee -a "$GITHUB_OUTPUT"
      - name: Push the manifest list to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf %s "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # copying the archives straight to the registry keeps the config blob, and with it the HEALTHCHECK
          podman manifest create ui
          for a in amd64 arm64; do
            skopeo copy --format v2s2 docker-archive:ui-$a.tar "docker://$IMAGE:$GITHUB_SHA-$a"
            podman manifest add ui "docker://$IMAGE:$GITHUB_SHA-$a"
          done
          # only the sha tag moves here; the tags users pull move after the pushed image has passed
          podman manifest push --format v2s2 ui "docker://$IMAGE:$GITHUB_SHA"
          skopeo inspect --raw "docker://$IMAGE:$GITHUB_SHA" | grep -E '"architecture"'
          # skopeo inspect --config hides the field, so read the config blob itself
          skopeo --override-os linux --override-arch arm64 copy "docker://$IMAGE:$GITHUB_SHA" dir:check
          grep -lq Healthcheck check/*
          skopeo inspect --raw "docker://$IMAGE:$GITHUB_SHA" | sha256sum
      - name: Run the pushed image
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          podman run -d --name ui -p 8080:8080 --read-only -v ui-state:/state \
            -e REGISTRY_URL=http://127.0.0.1:5000 -e UI_STATE_DIR=/state "$IMAGE:$GITHUB_SHA"
          for i in $(seq 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/healthz
          # /api/config asks the registry, which this run does not start, so read the baked-in value
          podman exec ui printenv APP_VERSION | grep -qx "$VERSION"
          podman exec ui printenv APP_REVISION | grep -qx "$GITHUB_SHA"
          podman image inspect "$IMAGE:$GITHUB_SHA" --format '{{.Digest}} {{.Architecture}}'
      - name: Move the tags users pull
        env:
          RELEASE: ${{ steps.decide.outputs.release }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          # main moves edge. A release tag publishes X.Y.Z (what Renovate pins), X.Y, X and latest. Same manifest list, same digest.
          tags=()
          [ "$GITHUB_REF" = refs/heads/main ] && tags+=(edge)
          if [ "$RELEASE" = true ]; then tags+=("$VERSION" "${VERSION%.*}" "${VERSION%%.*}" latest); fi
          for t in "${tags[@]}"; do skopeo copy --all --preserve-digests "docker://$IMAGE:$GITHUB_SHA" "docker://$IMAGE:$t"; done
          for t in "${tags[@]}"; do test "$(skopeo inspect --raw "docker://$IMAGE:$t" | sha256sum)" = "$(skopeo inspect --raw "docker://$IMAGE:$GITHUB_SHA" | sha256sum)"; done
      - name: Create the GitHub Release for the tag
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          raw=$(skopeo inspect --raw "docker://$IMAGE:$GITHUB_SHA")
          {
            cat RELEASE_NOTES.md
            printf '\n## Image\n\n`%s:%s` (also `%s`, `%s` and `latest`), linux/amd64 and linux/arm64, uid 65534.\n\n' "$IMAGE" "$VERSION" "${VERSION%.*}" "${VERSION%%.*}"
            printf 'Manifest list: `%s@sha256:%s`\n\n' "$IMAGE" "$(printf %s "$raw" | sha256sum | cut -d' ' -f1)"
            printf %s "$raw" | jq -r '.manifests[] | "- \(.platform.os)/\(.platform.architecture): `\(.digest)`"'
          } > notes.md
          gh release create "v$VERSION" --verify-tag --title "registry-lite-ui $VERSION" --notes-file notes.md
