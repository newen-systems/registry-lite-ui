<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registry</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <button id="menu" type="button" aria-label="Toggle repository tree" aria-controls="side" aria-expanded="false">Menu</button>
  <a href="#/" id="home">Registry</a> <span id="reg"></span> <span id="ver"></span>
  <span id="live" class="mut"></span>
  <span id="tick" aria-hidden="true" hidden></span>
  <span id="who"></span>
  <button id="prefs" type="button">Settings</button>
  <button id="help" type="button">Help</button>
</header>
<div id="banner" hidden></div>
<div id="app">
  <aside id="side">
    <div id="findbar">
      <input id="filter" type="search" placeholder="Filter" aria-label="Filter the tree" autocomplete="off" spellcheck="false">
      <button id="typesbtn" class="iconbtn" type="button" popovertarget="types" hidden></button>
    </div>
    <div id="types" popover></div>
    <div id="tree" role="tree" aria-label="Repositories"></div>
  </aside>
  <button id="grip" type="button" aria-label="Resize the tree"></button>
  <main id="main"></main>
</div>
<div id="scrim"></div>
<dialog id="dlg"><form method="dialog" id="form"></form></dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
